# Local infrastructure + full stack.
#   Infra only (for `pnpm dev`):  docker compose up -d postgres redis
#   Full stack:                   docker compose --profile app up --build
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa
      POSTGRES_DB: nexa
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexa']
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  migrate:
    profiles: [app]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ['node', 'dist/db/migrate.js']
    env_file: .env
    environment: &svc-env
      DATABASE_URL: postgresql://nexa:nexa@postgres:5432/nexa
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: [app]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      <<: *svc-env
      TRUST_PROXY_HOPS: '1'
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    profiles: [app]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ['node', 'dist/worker.js']
    env_file: .env
    environment: *svc-env
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    profiles: [app]
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:4000
    ports: ['3000:3000']
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
