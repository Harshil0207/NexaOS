name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: nexa, POSTGRES_PASSWORD: nexa, POSTGRES_DB: nexa_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U nexa" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nexa/shared build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit + integration tests (migrations run from a clean database)
        run: pnpm test
      - run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: nexa, POSTGRES_PASSWORD: nexa, POSTGRES_DB: nexa }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U nexa" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://nexa:nexa@localhost:5432/nexa
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3000
      COOKIE_SECURE: 'false'
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789
      API_INTERNAL_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:deploy
      - name: Start production stack
        run: |
          (cd apps/api && node dist/main.js &) 
          (cd apps/api && node dist/worker.js &)
          (cd apps/web && pnpm start &)
          npx wait-on -t 60000 http://localhost:4000/health http://localhost:3000/login
      - run: pnpm --filter @nexa/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report }

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t nexaos-api .
      - run: docker build -f apps/web/Dockerfile -t nexaos-web .
